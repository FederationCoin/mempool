version: "3.7"

# Build images from this FederationCoin fork. Do not use mempool.space or
# ghcr.io/retropex as the product image. Default stack is testnet (RPC 35332).
# Dummy MAIN (RPC 4094) is not launched; do not point CORE_RPC at it.

services:
  web:
    environment:
      FRONTEND_HTTP_PORT: "8080"
      BACKEND_MAINNET_HTTP_HOST: "api"
      AUDIT: "true"
      TESTNET_ENABLED: "true"
      MAINNET_ENABLED: "true"
      ROOT_NETWORK: "testnet"
      MEMPOOL_WEBSITE_URL: "https://mempool.federationcoin.org"
      HISTORICAL_PRICE: "false"
      ACCELERATOR: "false"
      ACCELERATOR_BUTTON: "false"
      LIGHTNING: "false"
      SERVICES_API: ""
    image: federationcoin-mempool-frontend:local
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    command: "./wait-for db:3306 --timeout=720 -- nginx -g 'daemon off;'"
    ports:
      - 80:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ | grep -q '<html' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  api:
    environment:
      MEMPOOL_NETWORK: "testnet"
      MEMPOOL_BACKEND: "none"
      CORE_RPC_HOST: "172.27.0.1"
      CORE_RPC_PORT: "35332"
      CORE_RPC_USERNAME: "mempool"
      CORE_RPC_PASSWORD: "mempool"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: "db"
      DATABASE_DATABASE: "mempool"
      DATABASE_USERNAME: "mempool"
      DATABASE_PASSWORD: "mempool"
      STATISTICS_ENABLED: "true"
      MEMPOOL_BLOCKS_SUMMARIES_INDEXING: "true"
      MEMPOOL_GOGGLES_INDEXING: "true"
      MEMPOOL_AUDIT: "true"
    image: federationcoin-mempool-backend:local
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    command: "./wait-for-it.sh db:3306 --timeout=720 --strict -- ./start.sh"
    volumes:
      - ./data:/backend/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8999/api/v1/backend-info | grep -q . || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  db:
    environment:
      MYSQL_DATABASE: "mempool"
      MYSQL_USER: "mempool"
      MYSQL_PASSWORD: "mempool"
      MYSQL_ROOT_PASSWORD: "admin"
      MARIADB_AUTO_UPGRADE: "1"
    image: mariadb:10.5.21
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ./mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mempool", "-pmempool"]
      interval: 5s
      timeout: 5s
      retries: 10
